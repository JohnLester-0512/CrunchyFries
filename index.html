<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Crunchy Fries</title>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, sans-serif;
    }

    body{
      background:#ffb703;
      padding:20px;
      color:#333;
    }

    .header{
      background:white;
      border-radius:25px;
      padding:40px 20px;
      text-align:center;
      margin-bottom:25px;
      box-shadow:0 5px 15px rgba(0,0,0,0.1);
    }

    .header h1{
      font-size:50px;
      color:#d62828;
      margin-bottom:10px;
    }

    .header p{
      font-size:22px;
      color:#444;
      font-style:italic;
    }

    .menu-box{
      background:white;
      border-radius:25px;
      padding:30px 20px;
      box-shadow:0 5px 15px rgba(0,0,0,0.1);
    }

    .menu-title{
      text-align:center;
      font-size:45px;
      margin-bottom:30px;
      color:#d62828;
    }
												.buy-btn{
  display:block;
  margin:15px auto 0;
  padding:12px 25px;
  border:none;
  border-radius:12px;
  background:#d62828;
  color:white;
  font-size:18px;
  cursor:pointer;
  transition:0.3s;
}

.buy-btn:hover{
  background:#a61c1c;
}
    .fries-card{
      background:#fff4d6;
      border-left:10px solid #d62828;
      border-radius:20px;
      padding:25px;
      margin-bottom:20px;
      text-align:center;
    }

    .fries-card h2{
      font-size:32px;
      margin-bottom:10px;
      color:#d62828;
    }

    .fries-card p{
      font-size:20px;
      margin-bottom:15px;
      line-height:1.5;
    }

    .price{
      font-size:35px;
      font-weight:bold;
      color:#fb8500;
    }

    .footer{
      text-align:center;
      margin-top:25px;
      font-size:16px;
      color:#7a4e00;
    }

  </style>
</head>

<body>

  <div class="header">
    <h1> Crunchy Fries </h1>
    <p>Masarap kahit walang sauce</p>
  </div>

  <div class="menu-box">

    <h1 class="menu-title">Our Menu</h1>

    <div class="fries-card">
      <h2>Classic Fries</h2>
      <p>Golden crispy fries with original flavor.</p>
      <div class="price">₱99</div>
    </div>
																<button class="buy-btn"
onclick="alert('Order Successfully!')">
Buy Now
</button>
    <div class="fries-card">
      <h2>Cheese Fries</h2>
      <p>Hot fries covered with creamy cheese sauce.</p>
      <div class="price">₱109</div>
    </div>
															<button class="buy-btn"
onclick="alert('Order Successfully!')">
Buy Now
</button>
    <div class="fries-card">
      <h2>BBQ Fries</h2>
      <p>Seasoned fries with smoky barbecue flavor.</p>
      <div class="price">₱109</div>
    </div>
													<button class="buy-btn"
onclick="alert('Order Successfully!')">
Buy Now
</button>
  </div>

  <div class="footer">
    © 2026 Crunchy Fries
  </div>
  
  
  
</body>
</html>
